# Gradle Performance Optimizations
# Enable parallel execution of tasks
org.gradle.parallel=true

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Enable build caching for faster incremental builds
org.gradle.caching=true

# Configuration cache is disabled by default due to compatibility issues with some plugins
# Enable it explicitly with --configuration-cache flag when needed
# org.gradle.configuration-cache=true
# org.gradle.configuration-cache.problems=warn

# Enable file system watching for better incremental build performance
org.gradle.vfs.watch=true

# Show only summary of warnings to reduce noise
org.gradle.warning.mode=summary

# JVM arguments for Gradle daemon
# -Xmx4g: Maximum heap size of 4GB (increased from 2GB for large projects)
# -Xms1g: Initial heap size (faster startup)
# -Dfile.encoding=UTF-8: Use UTF-8 encoding
# -XX:+UseG1GC: Use G1 garbage collector for better performance with large heaps
# -XX:MaxMetaspaceSize=1g: Limit metaspace to avoid memory issues
# -XX:+HeapDumpOnOutOfMemoryError: Create heap dump on OOM for debugging
# -XX:+UseStringDeduplication: Reduce memory usage by deduplicating strings
# -XX:MaxGCPauseMillis=200: Target max GC pause time
# -XX:+UseCompressedOops: Use compressed pointers for better memory efficiency
org.gradle.jvmargs=-Xmx4g -Xms1g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=200 -XX:+UseCompressedOops

# System properties
systemProp.file.encoding=UTF-8

# Kotlin compiler optimizations (for Gradle Kotlin DSL)
kotlin.incremental=true
kotlin.caching.enabled=true

# Gradle worker API optimization
org.gradle.workers.max=8

# Enable console output optimization
org.gradle.console=rich

# Gradle Performance Optimizations
# Enable parallel execution of tasks
org.gradle.parallel=true

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Enable build caching for faster incremental builds
org.gradle.caching=true

# Enable configuration cache for even faster builds (experimental)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Enable file system watching for better incremental build performance
org.gradle.vfs.watch=true

# Show only summary of warnings to reduce noise
org.gradle.warning.mode=summary

# JVM arguments for Gradle daemon
# -Xmx2g: Maximum heap size of 2GB
# -Dfile.encoding=UTF-8: Use UTF-8 encoding
# -XX:+UseParallelGC: Use parallel garbage collector for better performance
# -XX:+HeapDumpOnOutOfMemoryError: Create heap dump on OOM for debugging
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError

# System properties
systemProp.file.encoding=UTF-8
